function put(r,cb){var t=db.transaction("media","readwrite");t.objectStore("media").add(r);t.oncomplete=cb;t.onerror=function(){alert("저장 실패 (공간 부족 가능)")}}
function add(inp){
  var f=inp.files[0];inp.value="";if(!f)return;

  var r={eq:eq,cap:$("cap").value,date:new Date().toISOString().slice(0,10)};

  function raw(){r.blob=f;r.type=f.type;put(r,ok)}

  var u=URL.createObjectURL(f),im=new Image();
  im.onload=function(){
    var s=Math.min(1,1280/Math.max(im.width,im.height)),cv=document.createElement("canvas");
    cv.width=im.width*s;cv.height=im.height*s;cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);
    cv.toBlob(function(b){r.blob=b;r.type="image/jpeg";put(r,ok)},"image/jpeg",.7);URL.revokeObjectURL(u);
  };
  im.onerror=raw;im.src=u;
}

/* ---- 백업 (zip) ---- */
var CT=[];(function(){for(var n=0,c,k;n<256;n++){c=n;for(k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;CT[n]=c>>>0}})();
function crc(u){var c=0xFFFFFFFF;for(var i=0;i<u.length;i++)c=CT[(c^u[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function zip(files){
  var enc=new TextEncoder(),parts=[],cd=[],off=0,cs=0;
  files.forEach(function(f){
    var n=enc.encode(f.name),c=crc(f.data),L=f.data.length;
    var h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(12,0x21,true);
    h.setUint32(14,c,true);h.setUint32(18,L,true);h.setUint32(22,L,true);h.setUint16(26,n.length,true);
    parts.push(h.buffer,n,f.data);
    var g=new DataView(new ArrayBuffer(46));
    g.setUint32(0,0x02014b50,true);g.setUint16(4,20,true);g.setUint16(6,20,true);g.setUint16(8,0x0800,true);g.setUint16(14,0x21,true);
    g.setUint32(16,c,true);g.setUint32(20,L,true);g.setUint32(24,L,true);g.setUint16(28,n.length,true);g.setUint32(42,off,true);
    cd.push(g.buffer,n);cs+=46+n.length;off+=30+n.length+L;
  });
  var e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
  return new Blob(parts.concat(cd,[e.buffer]),{type:"application/zip"});
}
function cl(s){return String(s).replace(/[\\\/:*?"<>|\r\n]/g,"_").slice(0,60)}
function pth(e){return e.split(" > ").map(cl).join("/")}
function specOf(e){var p=e.split(" > "),a=D[p[0]]||[];for(var i=0;i<a.length;i++)if(a[i][0]==p[1])return p[1]+"\n"+a[i][1];return ""}
function backup(all){
  if(!db){alert("저장소를 열 수 없습니다");return}
  if(!all&&!eq){alert("층과 문을 먼저 선택하세요");return}
  $("bs").textContent="준비 중...";
  var q=db.transaction("media").objectStore("media").getAll();
  q.onsuccess=function(){
    var m=q.result.filter(function(r){return all||r.eq==eq}).sort(function(x,y){return x.id-y.id}),set={},tot=0;
    m.forEach(function(r){set[r.eq]=1;tot+=r.blob.size});
    if(all){for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k.indexOf(RP)===0)set[k.slice(RP.length)]=1}}
    else set[eq]=1;
    if(tot>500*1024*1024&&!confirm("용량이 큽니다(약 "+Math.round(tot/1048576)+"MB). 층별로 나눠 백업하는 것을 권합니다. 계속할까요?")){$("bs").textContent="";return}
    Promise.all(m.map(function(r){return r.blob.arrayBuffer()})).then(function(bufs){
      var files=[],enc=new TextEncoder(),cnt={};
      m.forEach(function(r,i){
        cnt[r.eq]=(cnt[r.eq]||0)+1;
        var ext=r.type=="image/jpeg"?"jpg":(r.type.split("/")[1]||"bin").replace("quicktime","mov");
        files.push({name:pth(r.eq)+"/"+r.date+"_"+String(cnt[r.eq]).padStart(2,"0")+(r.cap?"_"+cl(r.cap):"")+"."+ext,data:new Uint8Array(bufs[i])});
      });
      Object.keys(set).forEach(function(e){
        var p=pth(e),t=ls(RP+e).map(function(r){return r.d+"\n증상: "+r.s+"\n대응: "+r.a}).join("\n\n");
        files.push({name:p+"/기록.txt",data:enc.encode(t||"(기록 없음)")});
        var sp=specOf(e);if(sp)files.push({name:p+"/스펙.txt",data:enc.encode(sp)});
      });
      var a=document.createElement("a");
      a.href=URL.createObjectURL(zip(files));
      a.download="도어일지_백업_"+new Date().toISOString().slice(0,10)+".zip";
      document.body.appendChild(a);a.click();a.remove();
      $("bs").textContent="완료: 파일 "+files.length+"개";
    }).catch(function(){$("bs").textContent="실패: 용량이 너무 큽니다. 층별로 나눠 백업하세요."});
  };
}

    Promise.all(m.map(function(r){return b2u(r.blob)})).then(function(us){
      var h='<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+he(TT)+'</title><style>body{font-family:sans-serif;max-width:720px;margin:0 auto;padding:12px;background:#f4f6f8}h1{font-size:1.3em}section{background:#fff;border-radius:8px;padding:12px;margin:12px 0}h2{font-size:1.1em;margin:0 0 6px}pre{white-space:pre-wrap;font-family:inherit;margin:6px 0}.g{display:flex;flex-wrap:wrap;gap:8px}.g div{width:48%}.g img,.g video{width:100%;border-radius:6px}.g small{display:block}</style></head><body><h1>'+he(TT)+' 보고서</h1><p>작성일 '+new Date().toISOString().slice(0,10)+'</p>';
      Object.keys(set).sort().forEach(function(e){
        h+='<section><h2>'+he(e)+'</h2>';

/* ---- 불러오기 (백업 복원) ---- */
async function readZip(buf){
  var v=new DataView(buf),u=new Uint8Array(buf),n=u.length,p=-1;
  for(var i=n-22;i>=Math.max(0,n-65557);i--){if(v.getUint32(i,true)===0x06054b50){p=i;break}}
  if(p<0)throw new Error("zip");
  var cnt=v.getUint16(p+10,true),off=v.getUint32(p+16,true),out=[],dec=new TextDecoder();
  for(var k=0;k<cnt;k++){
    var m=v.getUint16(off+10,true),cs=v.getUint32(off+20,true),nl=v.getUint16(off+28,true),el=v.getUint16(off+30,true),cm=v.getUint16(off+32,true),lo=v.getUint32(off+42,true);
    var name=dec.decode(u.subarray(off+46,off+46+nl));
    off+=46+nl+el+cm;
    if(name.slice(-1)==="/")continue;
    var ds=lo+30+v.getUint16(lo+26,true)+v.getUint16(lo+28,true),data=u.subarray(ds,ds+cs);
    if(m===8){data=new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer())}
    else if(m!==0)continue;
    out.push({name:name,data:data});
  }
  return out;
}
function restore(inp){
  var f=inp.files[0];inp.value="";if(!f)return;
  if(!db){alert("저장소를 열 수 없습니다");return}
  $("rt").textContent="읽는 중...";
  f.arrayBuffer().then(readZip).then(function(files){
    var map={};
    Object.keys(D).forEach(function(k){D[k].forEach(function(x){var e=k+" > "+x[0];map[pth(e)]=e})});
    var TY={jpg:"image/jpeg",jpeg:"image/jpeg",png:"image/png",webp:"image/webp",gif:"image/gif",mp4:"video/mp4",mov:"video/quicktime",webm:"video/webm","3gpp":"video/3gpp"};
    var q=db.transaction("media").objectStore("media").getAll();
    q.onsuccess=function(){
      var have={},add2=[],dup=0,unk=0,recN=0;
      q.result.forEach(function(r){have[r.eq+"|"+r.date+"|"+r.blob.size]=1});
      files.forEach(function(fl){
        var p=fl.name.split("/");if(p.length<3)return;
        var e=map[p.slice(0,2).join("/")];
        if(!e){unk++;return}
        var fn=p.slice(2).join("/");
        if(fn==="스펙.txt")return;
        if(fn==="기록.txt"){
          var t=new TextDecoder().decode(fl.data),cur=ls(RP+e),seen={},ch=false;
          cur.forEach(function(r){seen[r.d+"|"+r.s+"|"+r.a]=1});
          t.split(/\n\n(?=[^\n]*\n증상: )/).forEach(function(s){
            var m=s.match(/^([^\n]*)\n증상: ([\s\S]*?)\n대응: ([\s\S]*)$/);
            if(!m)return;
            var key=m[1]+"|"+m[2]+"|"+m[3];
            if(seen[key])return;
            seen[key]=1;cur.push({d:m[1],s:m[2],a:m[3]});recN++;ch=true;
          });
          if(ch){
            cur.sort(function(a,b){return a.d<b.d?1:a.d>b.d?-1:0});
            try{localStorage.setItem(RP+e,JSON.stringify(cur))}catch(x){}
          }
          return;
        }
        var m=fn.match(/^(\d{4}-\d{2}-\d{2})_\d+(?:_(.*))?\.([A-Za-z0-9]+)$/);
        var ty=m&&TY[m[3].toLowerCase()];
        if(!ty){unk++;return}
        var b=new Blob([fl.data],{type:ty}),key=e+"|"+m[1]+"|"+b.size;
        if(have[key]){dup++;return}
        have[key]=1;
        add2.push({eq:e,cap:m[2]||"",date:m[1],blob:b,type:ty});
      });
      function done(){
        $("rt").textContent="완료: 사진·동영상 "+add2.length+"개, 기록 "+recN+"개 복원 (중복 "+dup+"개 건너뜀"+(unk?", 인식 못한 파일 "+unk+"개":"")+")";
        media();recs();
      }
      if(!add2.length){done();return}
      var t=db.transaction("media","readwrite"),s=t.objectStore("media");
      add2.forEach(function(r){s.add(r)});
      t.oncomplete=done;
      t.onerror=function(){$("rt").textContent="저장 실패: 저장 공간이 부족할 수 있습니다"};
    };
  }).catch(function(){$("rt").textContent="실패: 이 앱에서 만든 백업 zip 파일이 아닙니다."});
}
