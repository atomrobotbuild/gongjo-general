<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>전기 설비 일지</title>
<script>window.onerror=function(m,s,l){var e=document.getElementById("er");if(e)e.textContent="오류: "+m+" (줄 "+l+")"}</script>
<style>
body{font-family:sans-serif;max-width:640px;margin:0 auto;padding:12px;background:#f4f6f8}
input,textarea{width:100%;box-sizing:border-box;padding:9px;font-size:1em;margin-top:8px;border:1px solid #bbb;border-radius:4px}
button{margin-top:8px;padding:10px 12px;font-size:1em;border:0;border-radius:4px;background:#ef6c00;color:#fff}
.bb{display:block;width:100%;text-align:left;padding:16px;font-size:1.1em;background:#fff;color:#bf360c;border:2px solid #ef6c00}
.bb.bk{background:#546e7a;color:#fff;border-color:#546e7a}
.tabs{display:flex;margin-top:10px}.tabs button{flex:1;margin:0;border-radius:0;background:#90a4ae}.tabs button.on{background:#ef6c00}
.p{background:#fff;padding:10px;display:none}
pre{white-space:pre-wrap;font-family:inherit;line-height:1.6;margin:0}
.g{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.g div{width:48%}.g img,.g video{width:100%;background:#000}
.d{background:#c62828;padding:3px 10px;font-size:.8em;margin:0}
</style></head><body>
<div id="er" style="color:#c62828"></div>
<h2>전기 설비 일지</h2>
<div id="nav"></div>
<div id="main" style="display:none">
<div class="tabs"><button id="t1" class="on" onclick="tab(1)">이미지</button><button id="t2" onclick="tab(2)">스펙</button><button id="t3" onclick="tab(3)">기록</button></div>
<div class="p" id="p1" style="display:block">
<input id="cap" placeholder="사진 설명 (선택) 예) 차단기 상태, 계기판">
<button onclick="$('cp').click()">사진 촬영</button>
<button style="background:#6a1b9a" onclick="$('cv').click()">동영상 촬영</button>
<button style="background:#2e7d32" onclick="$('ga').click()">앨범</button>
<input type="file" id="cp" accept="image/*" capture="environment" hidden onchange="add(this)">
<input type="file" id="cv" accept="video/*" capture="environment" hidden onchange="add(this)">
<input type="file" id="ga" accept="image/*,video/*" hidden onchange="add(this)">
<div class="g" id="g"></div>
</div>
<div class="p" id="p2"><pre id="spec"></pre></div>
<div class="p" id="p3">
<input type="date" id="dt">
<textarea id="sy" rows="3" placeholder="관찰한 문제 (증상, 측정값)"></textarea>
<textarea id="ac" rows="3" placeholder="대응 (원인, 조치, 결과)"></textarea>
<button onclick="saveRec()">기록 저장</button>
<div id="rl"></div>
</div>
</div>

<div class="p" style="display:block;margin-top:12px">
<b>백업</b><br>
<button onclick="backup(false)">선택한 설비만 백업</button>
<button style="background:#2e7d32" onclick="backup(true)">전체 백업</button>
<div id="bs" style="margin-top:6px;font-size:.9em"></div>
<small>압축 파일 안에 설비별 폴더(사진·동영상·기록·스펙)가 만들어집니다.</small>
</div>

<script>
var $=function(i){return document.getElementById(i)};
var S="DO 순시기동·순시정지\nDI 자동/수동, 상태, 경보, 과전류(OCR 50/51), 지락·전압 계전기 등\nAI 전류 3상, 전압, 유효전력, 역률, 주파수\nPI 유효전력량\n※세부 점수는 도면(EP-09) 확인";
var D={
"자동제어 CCMS":[
["중앙관제 PC","1대\nCPU Intel i7 3.4GHz\n메모리 4GB, HDD 1TB\nDVD Writer, 키보드·마우스\nWindows 10"],
["관제 소프트웨어","KOBAS-2000 (2019166)\nOverview, Graphic, Trend\n조작·설정, Report(기록)\n자가진단, 엔지니어링\n사용자 계정 및 이력"],
["모니터·프린터·게이트웨이","모니터 27인치 LED 1대\n컬러 레이저 복합기 A4 1대\n게이트웨이(통신변환 인터페이스) 1대"],
["DDC 메인 모듈","CPU 32bit Embedded\n메모리 32MB RAM, 8MB Flash EEPROM\n전원 24VAC/24VDC\n통신 Modbus-485, TCP/IP\n크기 12.1×18.9×5.25cm"],
["DDC 확장 I/O 모듈","8bit RISC, 1kB SRAM, 512B EEPROM, 8kB Flash\n전원 24VAC/24VDC, RS485 절연\n자가진단 Watchdog Timer\n구성 12UI/8UO, 24UI, 5UI/4UO"],
["UPS","3kVA, 30분 백업"],
["DDC 판넬 (DDC-E)","B1F 전기실 1면\n900×1,500×250mm\n인터컴 1, TR 1, NFB 2, PL 1, NP 1"]],
"전력 관제점":[
["관제점 총괄","전기실 Digital Meter 연계 (EP-09)\nDO 18 / DI 61 / AI 82 / PI 9 = 170점\n별도 DDC-E 관제점 27점 (DO 7, DI 20)\n※세부 점수는 도면 확인"],
["SS-1",S],
["SS-2 (H/L)",S+"\nH: 무효전력(VAR) 점 추가"],
["SS-3 (H/L)",S+"\nH: 무효전력(VAR) 점 추가"],
["SS-6",S],
["SS-R","DI 무전압(NVR) 1\nAI 전류 1, 전압 1, 직류전압 1, 직류전류 1\n※세부 점수는 도면 확인"],
["GCP-1 · GCP-2-1 · GCP-2-2",S],
["DDC-E 관제점 (27점)","전기실 DDC-E\nDO 7, DI 20 (AI·PI 없음)\n대상: 인터컴, SS-1~SS-7, GEN\n항목: 순시기동·정지, 자동/수동, 상태, 경보, 지락누설, 변압기 고온, ATS 상태, LBS 상태\n※세부는 도면 확인"]],
"조명제어 장비":[
["제어 PC·모니터·프린터","PC Intel Core i5-6500 3.0GHz, HDD 1TB, 메모리 4GB\n모니터 24\" LED 와이드\n프린터 INJET A3/A4\n조명제어용 SW & MMI 프로그램"],
["전송 UNIT","1대 AC220V 60Hz\n제어 512회로, 전송거리 1,500m\n통신 출력전류 500mA"],
["I/F UNIT","1대 AC220V 60Hz\nRS-422/RS-485, 19,200bps\nPOLLING SELECTING 방식"],
["RELAY CONTROL T/U","48대\n단말기: 4회로, AC24V, 1.5mA, ON-OFF\nRELAY: 1회로 AC300V/20A\n조작 AC24V 350mA (평상시 0mA), LATCH TYPE"],
["강제패턴 단말기","1대 4회로 AC24V\n화재수신반 무전압 a접점 입력"],
["변압기 (TR)","10대 입력 AC220V, 출력 AC24V, 60VA"],
["FREE ADDRESS 설정기","1대 DC6V, 50mA\n4선식 전송, 액정 표시(단색)"],
["PROGRAM SWITCH","2CCT 10개, 3CCT 14개, 4CCT 12개 (1CCT 0개)"],
["조명제어반 수량","L.C.PANEL 500×600×150 3면\nL.C.PANEL 500×800×150 6면\nMAIN L.C.PANEL 1면\n※도면 합계(전등 166, 여유 26, 합 192, T/U 48)와 층별 값의 합이 달라 도면 확인 필요"]],
"조명제어반 (LCP)":[
["LCP-B1 (지하1층)","500×600×150\n전등 RELAY POINT 8 (여유 4, 합계 12)\nRELAY CONTROL T/U 3, 변압기 1"],
["LCP-1 (지상1층)","500×800×150\n전등 RELAY POINT 26 (여유 2, 합계 28)\nRELAY CONTROL T/U 7, 변압기 1"],
["LCP-2 (지상2층)","500×800×150\n전등 RELAY POINT 17 (여유 3, 합계 20)\nRELAY CONTROL T/U 5, 변압기 1"],
["LCP-3 (지상3층)","500×800×150\n전등 RELAY POINT 16 (여유 4, 합계 20)\nRELAY CONTROL T/U 5, 변압기 1"],
["LCP-4 (지상4층)","500×600×150\n전등 RELAY POINT 19 (여유 5, 합계 24)\nRELAY CONTROL T/U 6, 변압기 1"],
["LCP-5 (지상5층)","500×800×150\n전등 RELAY POINT 29 (여유 3, 합계 32)\nRELAY CONTROL T/U 8, 변압기 1"],
["LCP-6 (지상6층)","500×800×150\n전등 RELAY POINT 30 (여유 2, 합계 32)\nRELAY CONTROL T/U 8, 변압기 1"],
["LCP-7 (지상7층)","500×800×150\n전등 RELAY POINT 24 (여유 4, 합계 28)\nRELAY CONTROL T/U 7, 변압기 1"],
["LCP-옥탑 (옥탑층)","500×600×150\n전등 RELAY POINT 2 (여유 2, 합계 4)\nRELAY CONTROL T/U 1, 변압기 1"],
["LCP-M (지하1층 메인)","500×600×150\n변압기 1, 전송 UNIT 1, I/F UNIT 1\n강제패턴 단말기 1, FREE ADDRESS 설정기 1"]]
};
var db,urls=[],eq="",cat="";
function tab(n){[1,2,3].forEach(function(i){$("p"+i).style.display=i==n?"block":"none";$("t"+i).className=i==n?"on":""})}
$("dt").value=new Date().toISOString().slice(0,10);
function R(){
  var nav=$("nav");nav.innerHTML="";
  function mk(t,f,c){var b=document.createElement("button");b.className="bb "+(c||"");b.style.marginTop="8px";b.textContent=t;b.onclick=f;nav.appendChild(b)}
  function hd(t,cur){var h=document.createElement("div");h.textContent=t;h.style.cssText=cur?"background:#ef6c00;color:#fff;padding:10px;border-radius:6px;margin-top:8px":"margin-top:10px;font-weight:bold";nav.appendChild(h)}
  if(eq){hd(eq,1);mk("설비 바꾸기",function(){eq="";cat="";R()},"bk");$("main").style.display="block"}
  else if(!cat){hd("1단계: 분류를 누르세요 (v1)");Object.keys(D).forEach(function(k){mk(k,function(){cat=k;R()})});$("main").style.display="none"}
  else{hd(cat+" - 설비를 누르세요");D[cat].forEach(function(x,i){mk(x[0],function(){go(cat,i)})});mk("← 분류로 돌아가기",function(){cat="";R()},"bk");$("main").style.display="none"}
}
function go(k,i){cat=k;eq=k+" > "+D[k][i][0];$("spec").textContent=D[k][i][1];tab(1);R();media();recs();window.scrollTo(0,0)}
R();

try{
  var rq=indexedDB.open("jeongi-db",1);
  rq.onupgradeneeded=function(){rq.result.createObjectStore("media",{keyPath:"id",autoIncrement:true})};
  rq.onsuccess=function(){db=rq.result;media()};
}catch(e){}
function put(r,cb){var t=db.transaction("media","readwrite");t.objectStore("media").add(r);t.oncomplete=cb;t.onerror=function(){alert("저장 실패 (공간 부족 가능)")}}
function add(inp){
  var f=inp.files[0];inp.value="";if(!f)return;
  if(!eq){alert("분류와 설비를 먼저 선택하세요");return}
  var r={eq:eq,cap:$("cap").value,date:new Date().toISOString().slice(0,10)};
  function ok(){$("cap").value="";media()}
  function raw(){r.blob=f;r.type=f.type;put(r,ok)}
  if(f.type.indexOf("video")===0){raw();return}
  var u=URL.createObjectURL(f),im=new Image();
  im.onload=function(){
    var s=Math.min(1,1280/Math.max(im.width,im.height)),cv=document.createElement("canvas");
    cv.width=im.width*s;cv.height=im.height*s;cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);
    cv.toBlob(function(b){r.blob=b;r.type="image/jpeg";put(r,ok)},"image/jpeg",.7);URL.revokeObjectURL(u);
  };
  im.onerror=raw;im.src=u;
}
function media(){
  urls.forEach(function(u){URL.revokeObjectURL(u)});urls=[];
  var b=$("g");b.innerHTML="";
  if(!eq||!db)return;
  var q=db.transaction("media").objectStore("media").getAll();
  q.onsuccess=function(){
    var a=q.result.filter(function(r){return r.eq==eq}).sort(function(x,y){return y.id-x.id});
    if(!a.length){b.textContent="이 설비의 사진·동영상이 없습니다.";return}
    a.forEach(function(r){
      var u=URL.createObjectURL(r.blob);urls.push(u);
      var d=document.createElement("div"),v=r.type.indexOf("video")===0,m=document.createElement(v?"video":"img");
      if(v){m.controls=true;m.preload="metadata";m.playsInline=true}
      m.src=u;d.appendChild(m);
      var s=document.createElement("small");s.textContent=r.date+" "+r.cap;d.appendChild(s);
      var x=document.createElement("button");x.className="d";x.textContent="삭제";
      x.onclick=function(){if(confirm("삭제할까요?")){var t=db.transaction("media","readwrite");t.objectStore("media").delete(r.id);t.oncomplete=media}};
      d.appendChild(x);b.appendChild(d);
    });
  };
}
function ls(k){try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return []}}
function saveRec(){
  if(!eq){alert("설비를 먼저 선택하세요");return}
  if(!$("sy").value&&!$("ac").value)return;
  var a=ls("erec:"+eq);a.unshift({d:$("dt").value,s:$("sy").value,a:$("ac").value});
  try{localStorage.setItem("erec:"+eq,JSON.stringify(a))}catch(e){alert("저장 실패")}
  $("sy").value="";$("ac").value="";recs();
}
function recs(){
  var b=$("rl");b.innerHTML="";if(!eq)return;
  var a=ls("erec:"+eq);
  a.forEach(function(r,i){
    var d=document.createElement("div");d.style.cssText="border-top:1px solid #ddd;padding:6px 0;white-space:pre-wrap";
    d.textContent=r.d+"\n증상: "+r.s+"\n대응: "+r.a+"\n";
    var x=document.createElement("button");x.className="d";x.textContent="삭제";
    x.onclick=function(){if(confirm("삭제할까요?")){a.splice(i,1);localStorage.setItem("erec:"+eq,JSON.stringify(a));recs()}};
    d.appendChild(x);b.appendChild(d);
  });
}

var CT=[];(function(){for(var n=0,c,k;n<256;n++){c=n;for(k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;CT[n]=c>>>0}})();
function crc(u){var c=0xFFFFFFFF;for(var i=0;i<u.length;i++)c=CT[(c^u[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function zip(files){
  var enc=new TextEncoder(),parts=[],cd=[],off=0,cs=0;
  files.forEach(function(f){
    var n=enc.encode(f.name),c=crc(f.data),L=f.data.length;
    var h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(12,0x21,true);
    h.setUint32(14,c,true);h.setUint32(18,L,true);h.setUint32(22,L,true);h.setUint16(26,n.length,true);
    parts.push(h.buffer,n,f.data);
    var g=new DataView(new ArrayBuffer(46));
    g.setUint32(0,0x02014b50,true);g.setUint16(4,20,true);g.setUint16(6,20,true);g.setUint16(8,0x0800,true);g.setUint16(14,0x21,true);
    g.setUint32(16,c,true);g.setUint32(20,L,true);g.setUint32(24,L,true);g.setUint16(28,n.length,true);g.setUint32(42,off,true);
    cd.push(g.buffer,n);cs+=46+n.length;off+=30+n.length+L;
  });
  var e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
  return new Blob(parts.concat(cd,[e.buffer]),{type:"application/zip"});
}
function cl(s){return String(s).replace(/[\\\/:*?"<>|\r\n]/g,"_").slice(0,30)}
function pth(e){return e.split(" > ").map(cl).join("/")}
function specOf(e){var p=e.split(" > "),a=D[p[0]]||[];for(var i=0;i<a.length;i++)if(a[i][0]==p[1])return p[1]+"\n"+a[i][1];return ""}
function backup(all){
  if(!db){alert("저장소를 열 수 없습니다");return}
  if(!all&&!eq){alert("분류와 설비를 먼저 선택하세요");return}
  $("bs").textContent="준비 중...";
  var q=db.transaction("media").objectStore("media").getAll();
  q.onsuccess=function(){
    var m=q.result.filter(function(r){return all||r.eq==eq}).sort(function(x,y){return x.id-y.id}),set={},tot=0;
    m.forEach(function(r){set[r.eq]=1;tot+=r.blob.size});
    if(all){for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k.indexOf("erec:")===0)set[k.slice(5)]=1}}
    else set[eq]=1;
    if(tot>500*1024*1024&&!confirm("용량이 큽니다(약 "+Math.round(tot/1048576)+"MB). 설비별로 나눠 백업하는 것을 권합니다. 계속할까요?")){$("bs").textContent="";return}
    Promise.all(m.map(function(r){return r.blob.arrayBuffer()})).then(function(bufs){
      var files=[],enc=new TextEncoder(),cnt={};
      m.forEach(function(r,i){
        cnt[r.eq]=(cnt[r.eq]||0)+1;
        var ext=r.type=="image/jpeg"?"jpg":(r.type.split("/")[1]||"bin").replace("quicktime","mov");
        files.push({name:pth(r.eq)+"/"+r.date+"_"+String(cnt[r.eq]).padStart(2,"0")+(r.cap?"_"+cl(r.cap):"")+"."+ext,data:new Uint8Array(bufs[i])});
      });
      Object.keys(set).forEach(function(e){
        var p=pth(e),t=ls("erec:"+e).map(function(r){return r.d+"\n증상: "+r.s+"\n대응: "+r.a}).join("\n\n");
        files.push({name:p+"/기록.txt",data:enc.encode(t||"(기록 없음)")});
        var sp=specOf(e);if(sp)files.push({name:p+"/스펙.txt",data:enc.encode(sp)});
      });
      var a=document.createElement("a");
      a.href=URL.createObjectURL(zip(files));
      a.download="전기설비일지_백업_"+new Date().toISOString().slice(0,10)+".zip";
      document.body.appendChild(a);a.click();a.remove();
      $("bs").textContent="완료: 파일 "+files.length+"개";
    }).catch(function(){$("bs").textContent="실패: 용량이 너무 큽니다. 설비별로 백업하세요."});
  };
}
</script></body></html>
