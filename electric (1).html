<style>
:root{--bg:#f4f6fa;--fg:#1b2333;--card:#fff;--ac:#1f3864;--ln:#d5dbe6}
@media(prefers-color-scheme:dark){:root{--bg:#10151f;--fg:#e8ecf4;--card:#1a2232;--ac:#7aa2ff;--ln:#2d3850}}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 Arial,"Malgun Gothic",sans-serif;background:var(--bg);color:var(--fg);padding-bottom:40px}
header{background:var(--ac);color:#fff;padding:12px 14px;position:sticky;top:0;z-index:5}
@media(prefers-color-scheme:dark){header{color:#10151f}}
h1{margin:0;font-size:18px}#clk{font-size:14px;opacity:.9}
main{padding:12px;max-width:760px;margin:auto}
button,input,textarea{font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border:1px solid var(--ln);background:var(--card);color:var(--fg);padding:8px 12px;border-radius:20px}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
@media(prefers-color-scheme:dark){.chip.on{color:#10151f}}
.row{display:block;width:100%;text-align:left;background:var(--card);color:var(--fg);border:1px solid var(--ln);border-radius:10px;padding:12px;margin:6px 0}
.row small{display:block;opacity:.7}
.box{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:12px;margin:8px 0}
table{width:100%;border-collapse:collapse}td{border-bottom:1px solid var(--ln);padding:8px 4px;vertical-align:top}td:first-child{width:32%;opacity:.7}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:11px 14px;margin:4px 4px 4px 0}
@media(prefers-color-scheme:dark){.btn{color:#10151f}}
.btn.g{background:transparent;color:var(--fg);border:1px solid var(--ln)}
input[type=text],textarea{width:100%;padding:10px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--fg);margin:4px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.grid img,.grid video{width:100%;height:110px;object-fit:cover;border-radius:6px}
.ok{color:#1a8f3c}.wn{color:#c27a00}.er{color:#d33}
input[type=file]{display:none}
</style></head><body>

  const list=D.filter(i=>q?(i.n+i.c+JSON.stringify(i.s)).includes(q):i.c===cat);
  $('#app').innerHTML=`<input type="text" id="q" placeholder="설비 검색 (이름·TAG·도면번호)" value="${esc(q)}">
  <div class="chips">${CATS.map(c=>`<button class="chip ${c===cat&&!q?'on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>
  ${list.map(i=>`<button class="row" data-k="${esc(K(i))}"><b>${esc(i.n)}</b><small>${esc(i.c)} · 기록 ${(REC[K(i)]||[]).length}건</small></button>`).join('')||'<p>결과 없음</p>'}
  <div class="box"><b>백업 · 보고서</b><br>
  <button class="btn" id="bk">백업 내보내기(zip)</button><button class="btn g" id="rp">보고서(HTML)</button>
  <button class="btn g" id="im">불러오기(zip)</button><input type="file" id="imf" accept=".zip"></div>`;
  $('#q').oninput=e=>{q=e.target.value;const p=e.target.selectionStart;home();const n=$('#q');n.focus();n.setSelectionRange(p,p)};
  document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{cat=b.dataset.c;q='';home()});
  document.querySelectorAll('.row').forEach(b=>b.onclick=()=>{cur=D.find(i=>K(i)===b.dataset.k);tab='spec';detail()});
  $('#bk').onclick=backup;$('#rp').onclick=report;$('#im').onclick=()=>$('#imf').click();$('#imf').onchange=e=>restore(e.target.files[0]);
}
async function detail(){
  const k=K(cur);
  let h=`<button class="btn g" id="bk0">← 목록</button><h2 style="margin:6px 0">${esc(cur.n)}</h2><small>${esc(cur.c)}</small>
  <div class="chips">${[['spec','스펙'],['media','사진·영상'],['log','일지']].map(t=>`<button class="chip ${tab===t[0]?'on':''}" data-t="${t[0]}">${t[1]}</button>`).join('')}</div>`;
  if(tab==='spec')h+=`<div class="box"><table>${cur.s.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join('')}</table></div>`;
  if(tab==='media'){
    const ms=(await mAll()).filter(m=>m.k===k).sort((a,b)=>b.ts-a.ts);
    h+=`<button class="btn" id="cam">📷 촬영</button><button class="btn g" id="alb">🖼 앨범</button>
    <input type="file" id="f1" accept="image/*,video/*" capture="environment"><input type="file" id="f2" accept="image/*,video/*" multiple>
    <div class="grid" style="margin-top:8px">${ms.map(m=>`<div><${m.type.startsWith('video')?'video controls':'img'} src="${URL.createObjectURL(m.blob)}"></${m.type.startsWith('video')?'video':'img'}><small>${new Date(m.ts).toLocaleString('ko-KR')}</small><br><button class="btn g" data-d="${m.id}">삭제</button></div>`).join('')}</div>`;
  }
  if(tab==='log'){
    h+=`<div class="box"><b>일지 작성</b> <small>${now()}</small><br>점검자<input type="text" id="who" value="${esc(localStorage.getItem('ewho')||'')}">
    상태<div class="chips">${['양호','주의','이상'].map(s=>`<button class="chip ${st===s?'on':''}" data-s="${s}">${s}</button>`).join('')}</div>
    운전상태·지시값<input type="text" id="val" placeholder="예: 전압 380V, 전류 12A">
    관찰·조치 내용<textarea id="memo" rows="3"></textarea><button class="btn" id="sv">저장</button></div>
    ${(REC[k]||[]).map((r,n)=>`<div class="box"><b>${esc(r.t)}</b> · ${esc(r.w||'-')} · <b class="${{양호:'ok',주의:'wn',이상:'er'}[r.s]}">${r.s}</b><br>${esc(r.v||'')}<br>${esc(r.m||'').replace(/\n/g,'<br>')}<br><button class="btn g" data-r="${n}">삭제</button></div>`).join('')}`;
  }
  $('#app').innerHTML=h;$('#bk0').onclick=home;
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;detail()});
  if(tab==='media'){
    $('#cam').onclick=()=>$('#f1').click();$('#alb').onclick=()=>$('#f2').click();
    const up=async fs=>{for(const f of fs)await mAdd({k,type:f.type||'image/jpeg',ts:Date.now(),blob:f});detail()};
    $('#f1').onchange=e=>up(e.target.files);$('#f2').onchange=e=>up(e.target.files);
    document.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{if(confirm('삭제할까요?')){await mDel(+b.dataset.d);detail()}});
  }
  if(tab==='log'){
    document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{st=b.dataset.s;document.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b))});
    $('#sv').onclick=()=>{const w=$('#who').value;localStorage.setItem('ewho',w);(REC[k]=REC[k]||[]).unshift({t:now(),w,s:st,v:$('#val').value,m:$('#memo').value});save();detail()};
    document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{if(confirm('삭제할까요?')){REC[k].splice(+b.dataset.r,1);save();detail()}});
  }
}
async function backup(){
  if(!window.JSZip)return alert('zip 라이브러리를 불러오지 못했습니다(인터넷 확인)');
  const z=new JSZip(),ms=await mAll(),meta=[];
  z.file('records.json',JSON.stringify(REC));
  for(const m of ms){const [c,n]=m.k.split('|'),p=`${safe(c)}/${safe(n)}/${m.id}.${ext(m.type)}`;z.file(p,m.blob);meta.push({p,k:m.k,type:m.type,ts:m.ts})}
  z.file('media.json',JSON.stringify(meta));
  dl(await z.generateAsync({type:'blob'}),'전기설비일지_'+now().slice(0,10)+'.zip');
}
async function restore(f){
  if(!f)return;const z=await JSZip.loadAsync(f);
  const r=z.file('records.json');if(r){const o=JSON.parse(await r.async('string'));for(const k in o)REC[k]=[...(REC[k]||[]),...o[k].filter(x=>!(REC[k]||[]).some(y=>y.t===x.t&&y.m===x.m))];save()}
  const mj=z.file('media.json');if(mj)for(const m of JSON.parse(await mj.async('string'))){const b=await z.file(m.p).async('blob');await mAdd({k:m.k,type:m.type,ts:m.ts,blob:new Blob([b],{type:m.type})})}
  alert('불러오기 완료');home();
}
async function report(){
  const ms=await mAll(),rd=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
  let h='<meta charset="utf-8"><title>전기 설비 일지 보고서</title><body style="font-family:Arial,sans-serif;max-width:800px;margin:auto"><h1>전기 설비 일지 보고서</h1><p>'+now()+'</p>';
  for(const i of D){const k=K(i),rs=REC[k]||[],mm=ms.filter(m=>m.k===k);if(!rs.length&&!mm.length)continue;
    h+=`<h2>${esc(i.n)} <small>(${esc(i.c)})</small></h2><table border=1 cellpadding=4 style="border-collapse:collapse">${i.s.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join('')}</table>`;
    h+=rs.map(r=>`<p><b>${esc(r.t)}</b> ${esc(r.w||'')} [${r.s}] ${esc(r.v||'')}<br>${esc(r.m||'')}</p>`).join('');
    for(const m of mm)h+=m.type.startsWith('video')?'<p>(동영상은 백업 zip에 있음)</p>':`<img src="${await rd(m.blob)}" style="width:240px;margin:4px">`}
  dl(new Blob([h],{type:'text/html'}),'전기설비일지_보고서.html');
}
open().then(home);
</script></body></html>
